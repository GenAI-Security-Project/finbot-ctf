{% extends "base.html" %}

{% block title %}Confirm sign-in - OWASP FinBot CTF{% endblock %}

{% block nav %}
<a href="/" class="text-text-3 hover:text-cyan transition text-sm px-3 py-2 rounded-lg hover:bg-white/[0.03]">Home</a>
<a href="/portals" class="text-text-3 hover:text-cyan transition text-sm px-3 py-2 rounded-lg hover:bg-white/[0.03]">Portals</a>
{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center px-6 pt-16">
    <div class="max-w-md mx-auto text-center">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-cyan/15 rounded-full mb-8">
            <svg class="w-10 h-10 text-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
            </svg>
        </div>

        <h1 class="text-3xl font-bold text-text-1 mb-4">Confirm sign-in</h1>

        <p class="text-text-2 mb-8">Select the button below to finish signing in.</p>

        <form method="POST" action="/auth/verify">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="token" value="{{ token }}">
            <button type="submit" class="inline-flex items-center justify-center w-full bg-gradient-to-r from-cyan to-purple text-bg-primary px-6 py-3 rounded-xl font-semibold hover:shadow-[0_0_24px_rgba(0,212,255,0.25)] transition-all">
                Sign in
            </button>
        </form>
    </div>
</div>
{% endblock %}
