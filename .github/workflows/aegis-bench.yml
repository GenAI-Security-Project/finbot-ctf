name: AEGIS Benchmark Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_PROVIDER: mock

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'  # pyproject.toml requires >=3.13
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # tests/conftest.py loads the Google Sheets reporter plugin, so it needs gspread (same as test.yml)
        pip install pytest pytest-asyncio pytest-cov gspread google-auth google-auth-oauthlib

    - name: Run AEGIS test suite
      run: |
        mkdir -p test-results
        python -m pytest tests/unit/aegis tests/integration/aegis -v \
          --junitxml=test-results/aegis-junit.xml \
          --cov=finbot.aegis --cov-report=xml --cov-report=term-missing

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: aegis-test-results
        path: |
          test-results/
          coverage.xml
        if-no-files-found: warn
        retention-days: 7

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        files: coverage.xml
        fail_ci_if_error: false
        verbose: true
