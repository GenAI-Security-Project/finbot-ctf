name: Test Suite with Google Sheets Reporting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pytest pytest-asyncio pytest-cov gspread google-auth google-auth-oauthlib

    - name: Setup database
      run: python scripts/db.py migrate

    - name: Setup Google credentials
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      run: |
        if [ -n "$GOOGLE_CREDENTIALS" ] && [ -n "$GOOGLE_SHEETS_ID" ]; then
          echo "GOOGLE_CREDENTIALS=$GOOGLE_CREDENTIALS" >> $GITHUB_ENV
          echo "GOOGLE_SHEETS_ID=$GOOGLE_SHEETS_ID" >> $GITHUB_ENV
          echo "GS_FLAG=--google-sheets" >> $GITHUB_ENV
        else
          echo "GS_FLAG=" >> $GITHUB_ENV
          echo "Google Sheets credentials not configured — reporting disabled"
        fi

    - name: Run vendor isolation tests
      run: pytest tests/unit/vendor/test_vendor_isolation.py $GS_FLAG

    - name: Run session management tests
      run: pytest tests/unit/auth/test_secure_session_management.py $GS_FLAG

    - name: Run complete user isolation tests
      run: pytest tests/unit/isolation/test_complete_user_isolation.py $GS_FLAG
    
    - name: Run redis message stream tests
      run: pytest tests/unit/agents/test_redis_message_streams.py $GS_FLAG

  verify-change:
    name: Changed code is tested (no model key)
    # Pull requests only: on a push there is no base branch to compare with.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Non-blocking for now: three tests in test_specialized_agents.py fail on
    # main (_get_user_prompt became async). Flip this to false once they pass
    # so untested changes start failing the build.
    continue-on-error: true
    env:
      LLM_PROVIDER: mock

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # verify_change.py diffs against the merge base

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    # Install exactly what uv.lock pins. An unpinned install picks up
    # breaking releases (Starlette 1.x fails the vendor isolation tests).
    - name: Install dependencies from the lock file
      run: |
        python -m pip install --upgrade pip uv
        uv sync --frozen

    - name: Setup database
      run: uv run python scripts/db.py migrate

    - name: Find untested changes
      run: uv run python scripts/verify_change.py --base "origin/${{ github.base_ref }}" --coverage --json verify-change.json

    - name: Upload gap report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verify-change-report
        path: verify-change.json
        if-no-files-found: ignore
