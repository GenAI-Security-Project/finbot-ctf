name: Test Suite with Google Sheets Reporting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    # Install exactly what uv.lock pins. An unpinned install picks up
    # breaking releases (Starlette 1.x fails the vendor isolation tests).
    # The lock file already includes pytest, gspread and google-auth.
    - name: Install dependencies from the lock file
      run: |
        python -m pip install --upgrade pip uv
        uv sync --frozen

    - name: Setup database
      run: uv run python scripts/db.py migrate

    - name: Setup Google credentials
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      run: |
        if [ -n "$GOOGLE_CREDENTIALS" ] && [ -n "$GOOGLE_SHEETS_ID" ]; then
          echo "GOOGLE_CREDENTIALS=$GOOGLE_CREDENTIALS" >> $GITHUB_ENV
          echo "GOOGLE_SHEETS_ID=$GOOGLE_SHEETS_ID" >> $GITHUB_ENV
          echo "GS_FLAG=--google-sheets" >> $GITHUB_ENV
        else
          echo "GS_FLAG=" >> $GITHUB_ENV
          echo "Google Sheets credentials not configured — reporting disabled"
        fi

    - name: Run vendor isolation tests
      run: uv run pytest tests/unit/vendor/test_vendor_isolation.py $GS_FLAG

    - name: Run session management tests
      run: uv run pytest tests/unit/auth/test_secure_session_management.py $GS_FLAG

    - name: Run complete user isolation tests
      run: uv run pytest tests/unit/isolation/test_complete_user_isolation.py $GS_FLAG
    
    - name: Run redis message stream tests
      run: uv run pytest tests/unit/agents/test_redis_message_streams.py $GS_FLAG
